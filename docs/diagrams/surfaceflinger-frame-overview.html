<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SurfaceFlinger：控制路径与图像路径</title>
<style>
  :root {
    color-scheme: light;
    --page: #f8f9fa; --panel: #fff; --ink: #202124; --muted: #5f6368;
    --line: #cbd1d8; --domain: #f5f6f7; --process: #fff;
    --oem: #4285F4; --native: #34A853; --vendor: #FBBC04; --hardware: #9AA0A6;
    --node-ink: #102116; --hardware-ink: #202124; --hardware-surface: #edf0f2;
    --blue: #356dc9; --green: #237a44; --focus: #202124; --fade: .12;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --page: #202124; --panel: #282a2d; --ink: #e8eaed; --muted: #afb5be;
    --line: #565c66; --domain: #242629; --process: #303337;
    --hardware: #5F6368; --hardware-ink: #fff; --hardware-surface: #3c4043;
    --blue: #8ab4f8; --green: #81c995; --focus: #fff; --fade: .14;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { margin: 0; padding: 12px; background: var(--page); color: var(--ink); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
  main { display: flex; flex-direction: column; gap: 8px; height: 100%; min-height: 0; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  h1 { display: inline; margin: 0; font-size: 19px; line-height: 1.3; letter-spacing: -.4px; }
  .subtitle { margin-left: 10px; color: var(--muted); font-size: 11px; }
  .tools, .filters { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
  .tools { margin-left: auto; }
  .filters[hidden] { display: none; }
  button { padding: 4px 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--blue); }
  button[aria-pressed="true"] { background: var(--blue); color: var(--panel); border-color: var(--blue); }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  button:disabled { opacity: .35; cursor: default; }
  #zoom-level { width: 42px; font-size: 11px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
  .filter-label { color: var(--muted); margin-right: 5px; font-size: 11px; }
  .hint { color: var(--muted); margin-left: auto; font-size: 11px; }
  .diagram-shell { flex: 1 1 0; min-height: 160px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  svg { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; }
  svg text { font-family: inherit; fill: var(--ink); user-select: text; cursor: text; }
  svg.zoomed { cursor: grab; }
  svg.panning, svg.panning * { cursor: grabbing; user-select: none; }
  .domain { fill: var(--domain); stroke: var(--line); stroke-width: 1.4; }
  .process { fill: var(--process); stroke: var(--muted); stroke-width: 1.3; }
  .layer { fill: var(--process); stroke: var(--line); stroke-width: 1.5; }
  .layer-rule { fill: none; stroke: var(--line); stroke-width: 1; }
  .domain-title { font-size: 25px; font-weight: 720; }
  .process-title { font-size: 19px; font-weight: 680; }
  .layer-title { font-size: 21px; font-weight: 720; }
  .container-sub { font-size: 13px; fill: var(--muted); }
  .edge { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .edge.control { stroke: var(--blue); stroke-width: 2.1; }
  .edge.notification { stroke-dasharray: 3 5; }
  .edge.data { stroke: var(--green); stroke-width: 3.3; }
  .edge.encrypted { stroke: var(--muted); stroke-width: 2; }
  .edge.config { stroke: var(--muted); stroke-width: 1.8; stroke-dasharray: 6 5; }
  .edge-halo { fill: none; stroke: var(--panel); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
  .marker { fill: none; }
  .marker.control { stroke: var(--blue); }
  .marker.data { stroke: var(--green); }
  .marker.encrypted, .marker.config { stroke: var(--muted); }
  .flow-junction.control { fill: var(--blue); }
  .flow-junction.data { fill: var(--green); }
  .flow-junction.encrypted, .flow-junction.config { fill: var(--muted); }
  .edge-label rect { fill: var(--panel); opacity: .97; }
  .edge-label text { font-size: 13px; font-weight: 550; }
  .edge-label.control text { fill: var(--blue); }
  .edge-label.data text { fill: var(--green); }
  .edge-label.encrypted text, .edge-label.config text { fill: var(--muted); }
  .node { cursor: pointer; }
  .node rect { stroke: transparent; stroke-width: 1.5; }
  .node.oem rect { fill: var(--oem); }
  .node.native rect { fill: var(--native); }
  .node.vendor rect { fill: var(--vendor); }
  .node.hardware rect { fill: var(--hardware); }
  .node.neutral rect { fill: var(--process); stroke: var(--muted); }
  .node text { fill: var(--node-ink); }
  .node.hardware text { fill: var(--hardware-ink); }
  .node.neutral text { fill: var(--ink); }
  .node.memory rect { stroke: var(--panel); stroke-width: 2; }
  .node.zone rect { fill: var(--hardware-surface); stroke: var(--hardware); stroke-width: 1.5; }
  .node.zone .node-sub { fill: var(--muted); }
  .node.configured rect { fill: var(--process); stroke: var(--muted); stroke-dasharray: 5 4; }
  .node.configured text { fill: var(--muted); }
  .node:hover .face, .node:focus-visible .face { stroke: var(--focus); stroke-width: 2.8; }
  .node.selected .face { stroke: var(--focus); stroke-width: 4; }
  .node:focus { outline: none; }
  .node-name { font-size: 16px; font-weight: 680; }
  .node-sub { font-size: 12px; }
  .dim { opacity: var(--fade); }
  .node, .edge-group, .edge-label, .bridge, .flow-junction { transition: opacity .12s; }
  footer { display: flex; flex-direction: column; gap: 3px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 11px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .legend b { color: var(--ink); font-weight: 600; }
  .chip { display: inline-block; width: 17px; height: 11px; border: 1px solid transparent; border-radius: 2px; }
  .chip.oem { background: var(--oem); }
  .chip.native { background: var(--native); }
  .chip.vendor { background: var(--vendor); }
  .chip.hardware { background: var(--hardware); }
  .chip.neutral { background: var(--process); border-color: var(--muted); }
  .chip.configured { background: var(--process); border: 1px dashed var(--muted); }
  .line { display: inline-block; width: 23px; border-top: 2px solid var(--blue); }
  .line.notification { border-top-style: dotted; }
  .line.data { border-color: var(--green); border-top-width: 3px; }
  .line.encrypted { border-color: var(--muted); }
  .line.config { border-color: var(--muted); border-top-style: dashed; }
  .sources { font-size: 10px; color: var(--muted); }
  .sources:empty { display: none; }
  .sources a { color: var(--blue); }
  .detail { padding: 7px 11px; border-left: 3px solid var(--blue); border-radius: 0 5px 5px 0; background: var(--panel); min-height: 58px; max-height: 112px; overflow: auto; font-size: 12px; }
  .detail[hidden] { display: none; }
  .detail strong { font-size: 13px; margin-right: 9px; }
  #detail-body { color: var(--muted); }
  @media (max-width: 900px) { html:not(.slide) body { padding: 7px; } html:not(.slide) h1 { font-size: 16px; } html:not(.slide) .subtitle, html:not(.slide) .hint { display: none; } .tools { gap: 3px; } button { padding: 3px 7px; } }
  @media (max-width: 540px) { html:not(.slide) header { gap: 6px; } .tools { margin-left: 0; width: 100%; } html:not(.slide) .legend { gap: 3px 10px; font-size: 10px; } .filters { gap: 4px; } .detail { max-height: 100px; font-size: 11px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media print { html:not(.slide), html:not(.slide) body { height: auto; overflow: visible; background: #fff; } html:not(.slide) main { display: block; } .tools, .filters, .detail { display: none; } html:not(.slide) .diagram-shell { height: auto; border: 0; } html:not(.slide) svg { height: auto; } html:not(.slide) .legend { margin-top: 8px; } html.slide body { print-color-adjust: exact; -webkit-print-color-adjust: exact; } }
  html.slide, html.slide body { width: var(--slide-w); height: var(--slide-h); overflow: hidden; }
  html.slide body { padding: 0; }
  html.slide main { width: var(--slide-w); height: var(--slide-h); padding: 24px 32px 16px; gap: 10px; background: var(--panel); }
  html.slide h1 { font-size: 24px; }
  html.slide .subtitle { font-size: 13px; }
  html.slide .legend { font-size: 12px; }
  html.slide .diagram-shell { border: 0; border-radius: 0; }
  html.slide .tools, html.slide .filters, html.slide .hint, html.slide .sources, html.slide .detail { display: none !important; }
  html.slide.has-error .detail { display: block !important; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1 id="diagram-title"></h1><span class="subtitle" id="diagram-subtitle"></span></div>
    <div class="tools">
      <button id="fit" type="button">适应画布</button>
      <button id="zoom-out" type="button" aria-label="缩小">−</button><span id="zoom-level" aria-live="polite">100%</span><button id="zoom-in" type="button" aria-label="放大">+</button>
      <button id="clear" type="button">清除选择</button><button id="theme" type="button">深色</button>
    </div>
  </header>
  <nav class="filters" id="filters" aria-label="路径聚焦" hidden></nav>
  <section class="diagram-shell" aria-label="可缩放架构图">
    <svg id="architecture" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="group" aria-labelledby="svg-title svg-desc">
      <title id="svg-title"></title>
      <desc id="svg-desc"></desc>
      <defs>
        <clipPath id="frame-clip"><rect id="frame-rect" x="0" y="0"/></clipPath>
        <marker id="arrow-control" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="marker control" d="M1 1 L8 5 L1 9" stroke-width="2"/></marker>
        <marker id="arrow-data" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path class="marker data" d="M1 1 L9 5.5 L1 10" stroke-width="2.5"/></marker>
        <marker id="arrow-encrypted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="marker encrypted" d="M1 1 L8 5 L1 9" stroke-width="2"/></marker>
        <marker id="arrow-config" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="marker config" d="M1 1 L8 5 L1 9" stroke-width="1.8"/></marker>
      </defs>
      <g clip-path="url(#frame-clip)"><g id="viewport">
        <g id="containers"></g><g id="edges"></g><g id="bridge-overlays" pointer-events="none"></g><g id="nodes"></g><g id="edge-labels" pointer-events="none"></g>
      </g></g>
    </svg>
  </section>
  <footer><div class="legend" id="legend" aria-label="图例"></div><div class="sources" id="sources"></div></footer>
  <aside class="detail" aria-live="polite" aria-atomic="true" hidden><strong id="detail-title"></strong><span id="detail-body"></span></aside>
</main>
<script>
// Separate script so data errors, including syntax errors below, still show up in screenshots.
window.addEventListener('error', event => {
  document.documentElement.classList.add('has-error');
  document.querySelector('.detail').hidden = false;
  document.getElementById('detail-title').textContent = '图数据错误';
  document.getElementById('detail-body').textContent = event.message;
});
</script>
<script>
'use strict';
/* ==================== 图数据：新图只修改本段 ==================== */
// 嵌入文章时，高度消息类型为 `${DIAGRAM_ID}-height`。
const DIAGRAM_ID = 'surfaceflinger-frame-overview';
const META = {
  title: 'SurfaceFlinger：控制路径与图像路径',
  subtitle: 'Android 原生职责 · 物理显示输出',
  description: '应用通过 BufferQueue、BLAST 与 SurfaceControl 事务传入 Buffer 句柄和图层属性。SurfaceFlinger 为每个显示输出协商合成，CLIENT 图层由 GPU 写入 ClientTarget，DEVICE 图层与 ClientTarget 由显示控制器读取。',
  sources: [{text: '依据：QSSI frameworks/native · 2e1246c43c3b；呈现 Android / HWC 契约，驱动接口依平台而定。'}]
};
const WIDTH = 1500, HEIGHT = 1220;
const SLIDE = null;
const KIND_LABELS = {oem: 'OEM 自研', native: '系统原生（AOSP）', vendor: '厂商实现', hardware: '硬件 / 图像内存', neutral: '应用（来源随产品）', configured: '仅配置'};
const EDGE_LABELS = {control: '调用 / 句柄与状态', notification: '通知', data: '像素读写 / 输出', encrypted: '密文数据', config: '配置 / 分配'};

const containers = [
  {id: 'android', kind: 'domain', x: 20, y: 20, w: 1460, h: 695, title: 'Android', sub: '用户态进程与平台内核'},
  {id: 'app-process', kind: 'process', parent: 'android', x: 40, y: 85, w: 375, h: 450, title: '应用进程'},
  {id: 'sf-process', kind: 'process', parent: 'android', x: 440, y: 85, w: 635, h: 450, title: 'surfaceflinger'},
  {id: 'hal-process', kind: 'process', parent: 'android', x: 1100, y: 85, w: 360, h: 450, title: 'Composer HAL service'},
  {id: 'kernel', kind: 'layer', parent: 'android', x: 40, y: 565, w: 1420, h: 130, title: '平台图形驱动 / Linux kernel'},
  {id: 'hardware', kind: 'domain', x: 20, y: 750, w: 1460, h: 455, title: '硬件与图像内存', sub: '物理显示输出'}
];

const nodes = [
  {id: 'app-renderer', kind: 'neutral', parent: 'app-process', x: 90, y: 140, w: 275, h: 60, name: ['应用绘制组件'], sub: ['本例以 GPU 生产图像'], detail: '图中采用 GPU 绘制应用图像的常见情形。应用也可能通过 CPU、解码器或其他硬件生产图像；这些生产路径省略。应用代码来源随产品而定，因此使用中性色。queueBuffer 交接的是 Buffer 槽位与同步信息，不表示把像素复制到 SurfaceFlinger。'},
  {id: 'bufferqueue', kind: 'native', parent: 'app-process', x: 90, y: 245, w: 275, h: 60, name: ['BufferQueue'], sub: ['生产者 / 消费者与槽位'], detail: 'BLAST 模式的 BufferQueue 位于应用侧。生产者 dequeue、绘制、queue；BLAST 消费并把 GraphicBuffer、acquire fence 等放入事务。BufferQueue 管理 Buffer 交接和复用约束，不负责像素合成。'},
  {id: 'blast', kind: 'native', parent: 'app-process', x: 90, y: 350, w: 275, h: 60, name: ['BLASTBufferQueue'], sub: ['消费 Buffer，组织事务'], detail: 'BLAST 从 BufferQueue 获取图像 Buffer，通过 SurfaceControl::Transaction::setBuffer 将句柄、帧信息和 acquire fence 提交给 SurfaceFlinger。可与图层属性更新协调；事务的合并和同步方式由调用情形决定。'},
  {id: 'transaction', kind: 'native', parent: 'app-process', x: 90, y: 455, w: 275, h: 60, name: ['SurfaceControl::Transaction'], sub: ['Buffer 句柄 / Fence / 属性'], detail: '这是应用侧事务对象与接口，不是额外服务进程。Binder 传递图层状态、Buffer 句柄及同步信息；图像内存由句柄引用，像素不经过 Binder 消息复制。'},
  {id: 'layer-state', kind: 'native', parent: 'sf-process', x: 470, y: 140, w: 275, h: 70, name: ['Layer / LayerFE'], sub: ['图层状态 / 当前帧快照'], detail: 'SurfaceFlinger 接收事务并按本帧条件应用更新、采用 Buffer 和组织快照。LayerFE 向合成侧提供图层前端状态。快照帮助界定本帧读取的数据，本图不由此推断主线程与下一帧无锁并发。'},
  {id: 'compositionengine', kind: 'native', parent: 'sf-process', x: 470, y: 280, w: 275, h: 70, name: ['CompositionEngine'], sub: ['Output / OutputLayer'], detail: '按显示输出组织可见图层、几何和合成状态；向 HWC 写入状态并协商策略。一个图层可出现在多个输出，各输出拥有自己的 OutputLayer 状态。CLIENT 结果是 ClientTarget；DEVICE 图层直接保留其输入 Buffer 交给显示硬件。'},
  {id: 'hwcomposer', kind: 'native', parent: 'sf-process', x: 805, y: 280, w: 235, h: 70, name: ['HWComposer'], sub: ['SF 内部的 Composer 包装'], detail: 'SurfaceFlinger 内部的 HWComposer 包装 Composer HAL 接口，管理显示、图层、validate / present 和同步结果。部分状态命令采用批处理，其他接口可直接调用；它与厂商 Composer 服务是不同实体。'},
  {id: 'renderengine', kind: 'native', parent: 'sf-process', x: 470, y: 455, w: 275, h: 60, name: ['RenderEngine'], sub: ['CLIENT 图层的 GPU 绘制'], detail: 'RenderEngine 是 SurfaceFlinger 进程内的库。它把 CLIENT 图层的 Buffer 与绘制参数提交给 GPU，将结果写入 ClientTarget；可通过 GLES 或 Vulkan 后端。GPU 完成 Fence 供后续消费者等待，不表示整帧已经被显示。'},
  {id: 'composer-hal', kind: 'vendor', parent: 'hal-process', x: 1160, y: 280, w: 260, h: 70, name: ['Composer 实现'], sub: ['validate / present'], detail: '厂商实现结合显示硬件能力返回合成类型变更、请求与同步结果。validate 决定本帧所需策略，present 提交显示工作。present 调用返回、present fence 信号与实际扫描显示的语义需要分别理解，不能把返回成功等同于立即亮屏。'},
  {id: 'gpu-driver', kind: 'vendor', parent: 'kernel', x: 560, y: 625, w: 280, h: 56, name: ['GPU 驱动'], sub: ['平台相关命令提交接口'], detail: '泛化的平台 GPU 驱动实体；用户态 GLES / Vulkan 厂商实现和具体设备接口省略。这里不声称采用某个设备文件，也不描述本车的虚拟化与驱动部署。命令路径最终安排 GPU 访问导入的图像内存。'},
  {id: 'display-driver', kind: 'vendor', parent: 'kernel', x: 1110, y: 625, w: 280, h: 56, name: ['显示驱动'], sub: ['平台相关显示提交接口'], detail: '泛化的平台显示驱动实体。Composer 与驱动之间的实际接口依平台而定，本图不预设 DRM / KMS、设备文件或虚拟机边界。驱动提交显示控制器状态并提供完成同步。'},
  {id: 'app-buffer', kind: 'hardware', memory: true, parent: 'hardware', x: 100, y: 865, w: 280, h: 64, name: ['应用图像 Buffer'], sub: ['生产者分配，SF / HWC 导入'], detail: '图中代表应用提交的图像内存集合，不表示所有图层只有一块 Buffer。每个实际 Buffer 在图中只对应一个内存实体：CLIENT 时由 GPU 读取，DEVICE 时由显示控制器读取。槽位可复用前需满足相应 release fence 约束。'},
  {id: 'gpu', kind: 'hardware', zone: true, parent: 'hardware', x: 590, y: 865, w: 220, h: 64, name: ['GPU'], sub: ['应用绘制 / CLIENT 合成'], detail: 'GPU 可生产应用图像，也可执行 RenderEngine 组织的客户端合成。图中的两种工作是不同提交；DEVICE 仅表示该图层不需要 SurfaceFlinger 的 GPU 合成，应用先前仍可能使用 GPU 生成它。'},
  {id: 'client-target', kind: 'hardware', memory: true, parent: 'hardware', x: 560, y: 1040, w: 280, h: 64, name: ['ClientTarget Buffer'], sub: ['输出侧分配，GPU 写入 / HWC 导入'], detail: 'CLIENT 图层的 GPU 合成结果写入该输出 Buffer。RenderSurface / DisplaySurface 在输出侧协调 BufferQueue 和交接，物理显示通常经 FramebufferSurface 取得 Buffer 后调用 setClientTarget；这些对象在本总览中省略，详见正文。'},
  {id: 'display-controller', kind: 'hardware', zone: true, parent: 'hardware', x: 1110, y: 980, w: 280, h: 64, name: ['显示控制器'], sub: ['读取 DEVICE 图层与 ClientTarget'], detail: '显示控制器读取交给它的图层 Buffer 和可选 ClientTarget，执行平台支持的组合并产生物理显示输出。DEVICE / CLIENT 比例取决于本帧图层与硬件约束。release fence 约束各 Buffer 后续复用；present fence 描述输出呈现相关完成，两者用途不同。'},
  {id: 'display', kind: 'hardware', parent: 'hardware', x: 1110, y: 1120, w: 280, h: 64, name: ['物理显示输出'], sub: ['扫描输出到显示设备'], detail: '本图聚焦物理显示输出。虚拟屏的目标 Buffer、屏幕录像以及多显示输出在正文另行说明；它们不能直接套用物理扫描输出的全部步骤。'}
];

const edges = [
  {id: 'render-queue', from: 'app-renderer', to: 'bufferqueue', type: 'control', label: 'dequeue / queue', lx: 247, ly: 224, labelAnchor: 'start'},
  {id: 'queue-blast', from: 'bufferqueue', to: 'blast', type: 'control', notification: true, label: 'Buffer 可获取', lx: 247, ly: 330, labelAnchor: 'start'},
  {id: 'blast-transaction', from: 'blast', to: 'transaction', type: 'control', label: 'setBuffer', lx: 247, ly: 435, labelAnchor: 'start'},
  {id: 'transaction-layer', from: 'transaction', to: 'layer-state', type: 'control', fromSide: 'right', toSide: 'left', via: [{x: 425}, {y: 175}], label: 'Binder 事务', lx: 435, ly: 248, labelAnchor: 'start'},

    const rb = Math.abs(b[j].x - point.x) + Math.abs(b[j].y - point.y);

/**
 * Add jump-over semicircles to true interior crossings of orthogonal SVG routes.
 *
 * edges: [{ id, d, ... }], where d uses absolute M/H/V/L commands.
 * visibleIds: Set of actually rendered edge IDs; omit to use every edge.
 * Returns a Map containing a path for EVERY edge, including unchanged/hidden ones.
 * Apply the returned d to both the edge path and its background-colored halo.
 * result.bridgeArcs is a Map of edge ID -> array of standalone arc-only paths.
 * Draw these arcs again in a dedicated layer ABOVE every base edge and BELOW
 * nodes: halo first, then foreground, without arrow markers. This guarantees
 * the jump owns the crossing gap, regardless of base-edge drawing order.
 * The input objects and original route strings remain untouched.
 *
 * Horizontal routes jump upward. Shared endpoints, elbows, collinear sections,
 * unsupported curved routes and crowded/obstructed crossings are left unchanged.
 * SVG markers remain on the original path endpoints.
 */
function routeCrossingBridges(edges, visibleIds, options = {}) {
  const radius = options.radius ?? 6;
  const clearance = options.clearance ?? 3;
  const separation = options.separation ?? 4;
  if (![radius, clearance, separation].every(Number.isFinite) || radius <= 0 || clearance < 0 || separation < 0) {

    if (/[^\d\s.,+\-eEMHVL]/.test(edge.d)) return null;
    const tokens = edge.d.match(/[MHVL]|[-+]?(?:\d*\.\d+|\d+\.?\d*)(?:[eE][-+]?\d+)?/g) || [];
    let index = 0, command = null, point = null;
    const parts = [];
    const read = () => {
      if (index >= tokens.length || /^[MHVL]$/.test(tokens[index])) throw new Error('Missing coordinate');
      const value = Number(tokens[index++]);
      if (!Number.isFinite(value)) throw new Error('Non-finite coordinate');
      return value;
    };
    try {
      while (index < tokens.length) {
        if (/^[MHVL]$/.test(tokens[index])) command = tokens[index++];
        if (!command || (command !== 'M' && !point)) return null;
        let next;
        if (command === 'M' || command === 'L') next = {x:read(), y:read()};
        else if (command === 'H') next = {x:read(), y:point.y};
        else if (command === 'V') next = {x:point.x, y:read()};
        if (command === 'M') {
          parts.push({move:next});
          command = 'L';

          const horizontal = near(point.y, next.y);

    if (visibleIds && !visibleIds.has(edge.id)) continue;
    const parts = parse(edge);
    if (!parts) continue;
    routes.push({edge, parts});
    segments.push(...parts.filter(part => !part.move && part.length > epsilon));

    // route must not be hit by the new arc, even though the base lines did not cross.
    const left = crossing.x - radius - clearance;
    const right = crossing.x + radius + clearance;
    const top = crossing.y - radius - clearance;
    const bottom = crossing.y + clearance;

  }
  if (edge.label) {
    const position = labelPosition(edge);
    const label = element('g', {class: `edge-label ${edge.type}`, 'data-label-for': edge.id}, labelLayer);
    element('rect', {rx: 3}, label);
    element('text', {x: position.x, y: position.y, 'text-anchor': position.anchor}, label, edge.label);
    parts.push(label);
  }
  edgeElements.set(edge.id, parts);
}
const junctionElements = junctionPoints.map(point => ({
  point, element: element('circle', {class: `flow-junction ${point.type}`, cx: point.x, cy: point.y, r: 4}, overlay)
}));

const nodeLayer = document.getElementById('nodes');
for (const node of nodes) {
  const classes = ['node', node.kind, node.memory && 'memory', node.zone && 'zone', node.configured && 'configured'].filter(Boolean).join(' ');
  const group = element('g', {class: classes, tabindex: 0, role: 'button', 'aria-pressed': 'false', 'aria-label': `${node.name.join(' ')}。点击查看详情与直连关系`, 'data-node': node.id, 'data-parent': node.parent}, nodeLayer);
  if (node.detail) element('title', {}, group, node.detail);
  if (node.memory) {
    element('rect', {x: node.x + 8, y: node.y - 8, width: node.w - 8, height: node.h, rx: 6}, group);
    element('rect', {x: node.x + 4, y: node.y - 4, width: node.w - 4, height: node.h, rx: 6}, group);
  }
  element('rect', {class: 'face', x: node.x, y: node.y, width: node.w, height: node.h, rx: 6}, group);
  const lines = [...node.name.map(text => ({text, kind: 'node-name', height: 20})), ...(node.sub ?? []).map(text => ({text, kind: 'node-sub', height: 17}))];
  let cursor = node.y + (node.h - lines.reduce((sum, line) => sum + line.height, 0)) / 2 + 15;
  for (const line of lines) {
    element('text', {class: line.kind, x: node.x + node.w / 2, y: cursor, 'text-anchor': 'middle'}, group, line.text);
    cursor += line.height;
  }
  group.addEventListener('click', () => { if (!suppressClick) selectNode(node.id); });
  group.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectNode(node.id); }
  });
  nodeElements.set(node.id, group);
}

function sizeLabels() {
  for (const label of labelLayer.children) {
    const box = label.querySelector('text').getBBox();
    const rect = label.querySelector('rect');
    for (const [key, value] of Object.entries({x: box.x - 5, y: box.y - 2, width: box.width + 10, height: box.height + 4})) rect.setAttribute(key, value);
  }
}
sizeLabels();
if (document.fonts) document.fonts.ready.then(sizeLabels);

/* ---------- 图例与依据 ---------- */
function legendItem(chipClass, text) {
  const span = document.createElement('span');
  const chip = document.createElement('i');
  chip.className = chipClass;
  span.append(chip, text);
  return span;
}
function legendHeading(text) {
  const span = document.createElement('span');
  const bold = document.createElement('b');
  bold.textContent = text;
  span.append(bold);
  return span;
}
const legend = document.getElementById('legend');
const usedKinds = NODE_KINDS.filter(kind => nodes.some(n => n.kind === kind && !n.configured));
if (nodes.some(n => n.configured)) usedKinds.push('configured');
legend.append(legendHeading('组件来源'), ...usedKinds.map(kind => legendItem(`chip ${kind}`, KIND_LABELS[kind])));
const usedLines = [];
if (edges.some(e => e.type === 'control' && !e.notification)) usedLines.push('control');
if (edges.some(e => e.notification)) usedLines.push('notification');
for (const type of ['data', 'encrypted', 'config']) if (edges.some(e => e.type === type)) usedLines.push(type);
legend.append(legendHeading('连线'), ...usedLines.map(kind => legendItem(`line ${kind}`, EDGE_LABELS[kind])));
const notes = [];
if (edges.some(e => routed.bridgeArcs.get(e.id).length)) notes.push('跨线弧表示交叉不连接');
if (junctionPoints.length) notes.push('实心点为分支');
if (notes.length) {
  const span = document.createElement('span');
  span.textContent = notes.join(' · ');
  legend.append(span);
}
const hint = document.createElement('span');
hint.className = 'hint';
hint.textContent = '点击组件查看直连关系 · 拖动空白平移 · Esc 清除';
legend.append(hint);

const sources = document.getElementById('sources');
(META.sources ?? []).forEach((source, index) => {
  sources.append(index ? ' · ' : '依据：');
  if (source.href && /^https?:\/\//i.test(source.href)) {
    const link = document.createElement('a');
    link.href = source.href;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = source.text;
    sources.append(link);
  } else {
    sources.append(source.text);
  }
});

/* ---------- 交互：选择、聚焦、缩放、主题、嵌入高度 ---------- */
if (flows.length) {
  filterNav.hidden = false;
  const label = document.createElement('span');
  label.className = 'filter-label';
  label.textContent = '聚焦';
  filterNav.append(label);
  for (const flow of [{id: '', label: '全部'}, ...flows]) {
    const button = document.createElement('button');
    button.type = 'button';
    button.dataset.flow = flow.id;
    button.textContent = flow.label;
    button.addEventListener('click', () => { activeFlow = flow.id || null; selection = null; updateHighlight(); });
    filterNav.append(button);
  }
}

function visibleEdgeIds() {
  if (selection) return new Set(edges.filter(e => e.from === selection || e.to === selection).map(e => e.id));
  if (activeFlow) return new Set(flowById.get(activeFlow).edges);
  return null;
}
function updateHighlight() {
  const visible = visibleEdgeIds();
  const shown = id => !visible || visible.has(id);
  const activeNodes = new Set(selection ? [selection] : []);
  for (const e of edges) if (shown(e.id)) { activeNodes.add(e.from); activeNodes.add(e.to); }
  nodeElements.forEach((group, id) => {
    group.classList.toggle('dim', Boolean(visible) && !activeNodes.has(id));
    group.classList.toggle('selected', id === selection);
    group.setAttribute('aria-pressed', String(id === selection));
  });
  edgeElements.forEach((parts, id) => parts.forEach(part => part.classList.toggle('dim', !shown(id))));
  junctionElements.forEach(({point, element: dot}) => dot.classList.toggle('dim', [...point.edges].filter(shown).length < 2));
  filterNav.querySelectorAll('button').forEach(button => button.setAttribute('aria-pressed', String((button.dataset.flow || null) === activeFlow)));
  const source = selection ? nodeById.get(selection) : activeFlow ? flowById.get(activeFlow) : null;
  document.querySelector('.detail').hidden = !source;
  if (source) {
    document.getElementById('detail-title').textContent = selection ? source.name.join(' · ') : source.label;
    document.getElementById('detail-body').textContent = source.detail ?? '';
  }
  reportHeight();
}
function selectNode(id) { selection = selection === id ? null : id; updateHighlight(); }
function clearSelection() { selection = null; activeFlow = null; updateHighlight(); }
document.getElementById('clear').addEventListener('click', clearSelection);
document.addEventListener('keydown', event => { if (event.key === 'Escape') clearSelection(); });

function paintCamera() {
  const w = WIDTH / zoom, h = HEIGHT / zoom;
  camera.x = Math.max(0, Math.min(WIDTH - w, camera.x));
  camera.y = Math.max(0, Math.min(HEIGHT - h, camera.y));
  viewport.setAttribute('transform', `scale(${zoom}) translate(${-camera.x} ${-camera.y})`);
  svg.classList.toggle('zoomed', zoom > 1);
  document.getElementById('zoom-level').textContent = `${Math.round(zoom * 100)}%`;
  document.getElementById('zoom-out').disabled = zoom <= 1;
  document.getElementById('zoom-in').disabled = zoom >= MAX_ZOOM;
}
function zoomTo(next, point) {
  const target = Math.max(1, Math.min(MAX_ZOOM, next));
  const center = point ?? {x: camera.x + WIDTH / zoom / 2, y: camera.y + HEIGHT / zoom / 2};
  camera.x = center.x - (center.x - camera.x) * zoom / target;
  camera.y = center.y - (center.y - camera.y) * zoom / target;
  zoom = target;
  paintCamera();
}
function focusArea(area) {
  zoom = Math.max(1, Math.min(MAX_ZOOM, WIDTH / area.w, HEIGHT / area.h));
  camera.x = area.x + area.w / 2 - WIDTH / zoom / 2;
  camera.y = area.y + area.h / 2 - HEIGHT / zoom / 2;
  paintCamera();
}
function diagramPoint(event) {
  const matrix = viewport.getScreenCTM();
  return matrix ? new DOMPoint(event.clientX, event.clientY).matrixTransform(matrix.inverse()) : null;
}
const fitButton = document.getElementById('fit');
for (const area of views) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = area.label;
  button.addEventListener('click', () => focusArea(area));
  fitButton.before(button);
}
fitButton.addEventListener('click', () => focusArea({x: 0, y: 0, w: WIDTH, h: HEIGHT}));
document.getElementById('zoom-in').addEventListener('click', () => zoomTo(zoom * 1.3));
document.getElementById('zoom-out').addEventListener('click', () => zoomTo(zoom / 1.3));
svg.addEventListener('wheel', event => {
  // Embedded in an article: plain wheel scrolls the page; Ctrl/⌘ + wheel zooms.
  if (slide || (window.parent !== window && !event.ctrlKey && !event.metaKey)) return;
  event.preventDefault();
  zoomTo(zoom * Math.exp(-event.deltaY * .0015), diagramPoint(event) ?? undefined);
}, {passive: false});
svg.addEventListener('pointerdown', event => {
  if (event.button !== 0 || zoom <= 1 || event.target.closest('text')) return;
  const matrix = svg.getScreenCTM();
  if (matrix) drag = {id: event.pointerId, x: event.clientX, y: event.clientY, cx: camera.x, cy: camera.y, scale: matrix.a * zoom, moved: false};
});
svg.addEventListener('pointermove', event => {
  if (!drag || drag.id !== event.pointerId) return;
  const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; svg.setPointerCapture(event.pointerId); svg.classList.add('panning'); }
  if (drag.moved) { camera.x = drag.cx - dx / drag.scale; camera.y = drag.cy - dy / drag.scale; paintCamera(); }
});
function stopDrag(event) {
  if (!drag || drag.id !== event.pointerId) return;
  suppressClick = drag.moved;
  drag = null;
  svg.classList.remove('panning');
  if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
  setTimeout(() => { suppressClick = false; }, 0);
}
svg.addEventListener('pointerup', stopDrag);
svg.addEventListener('pointercancel', stopDrag);
svg.addEventListener('click', event => {
  if (!suppressClick && !event.target.closest('.node') && selection) { selection = null; updateHighlight(); }
});

const themeButton = document.getElementById('theme');
function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  themeButton.textContent = theme === 'dark' ? '浅色' : '深色';
  themeButton.setAttribute('aria-label', `切换到${theme === 'dark' ? '浅色' : '深色'}主题`);
}
const requestedTheme = new URLSearchParams(location.search).get('theme');
setTheme(['light', 'dark'].includes(requestedTheme) ? requestedTheme : slide ? 'light' : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
themeButton.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));

function reportHeight() {
  if (slide || window.parent === window) return;
  const shell = document.querySelector('.diagram-shell');
  const chrome = document.querySelector('main').getBoundingClientRect().height - shell.getBoundingClientRect().height + 24;
  const height = Math.min(2400, Math.max(480, Math.ceil(shell.clientWidth * HEIGHT / WIDTH + chrome)));
  if (height === lastHeight) return;
  lastHeight = height;
  window.parent.postMessage({type: `${DIAGRAM_ID}-height`, height}, location.origin === 'null' ? '*' : location.origin);
}
new ResizeObserver(reportHeight).observe(document.querySelector('main'));
paintCamera();
updateHighlight();
if (slide) {
  const main = document.querySelector('main');
  const frame = main.getBoundingClientRect();
  const shell = document.querySelector('.diagram-shell');
  const scale = Math.min(shell.clientWidth / WIDTH, shell.clientHeight / HEIGHT);
  if (Math.abs(frame.width - slide.width) > 1 || Math.abs(frame.height - slide.height) > 1) {
    throw new Error(`幻灯片应为 ${slide.width}×${slide.height}，实际 ${Math.round(frame.width)}×${Math.round(frame.height)}`);
  }
  if (main.scrollHeight > main.clientHeight + 1 || main.scrollWidth > main.clientWidth + 1) throw new Error('标题、图和图例超出幻灯片，精简图例或标题');
  if (scale < MIN_SLIDE_SCALE) {
    throw new Error(`图区 ${shell.clientWidth}×${shell.clientHeight}，画布 ${WIDTH}×${HEIGHT} 需缩放到 ${scale.toFixed(2)}，文字会小于 10pt；把画布控制在 ${Math.floor(shell.clientWidth / MIN_SLIDE_SCALE)}×${Math.floor(shell.clientHeight / MIN_SLIDE_SCALE)} 以内，或精简内容`);
  }
}
</script>
</body>
</html>
