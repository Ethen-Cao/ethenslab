const svgNS='http://www.w3.org/2000/svg';
const canvas=document.getElementById('architecture');
const nodeLayer=document.getElementById('nodes');
const edgeLayer=document.getElementById('edges');
const labelLayer=document.getElementById('edge-labels');
const index=new Map(modules.map(m=>[m.id,m]));
function svgEl(tag,attrs={},text){const el=document.createElementNS(svgNS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);if(text!==undefined)el.textContent=text;return el;}
for(const link of links){const g=svgEl('g',{class:'edge-group','data-edge':link.id});const path=svgEl('path',{class:'edge '+link.type,d:link.d,'marker-end':'url(#arrow-'+link.type+')'});if(link.both)path.setAttribute('marker-start','url(#arrow-'+link.type+')');g.append(path);edgeLayer.append(g);if(link.label){const lg=svgEl('g',{class:'edge-label '+link.type,'data-edge':link.id});if(link.rotate)lg.setAttribute('transform','rotate('+link.rotate+' '+link.lx+' '+link.ly+')');const w=Math.max(60,link.label.length*6.1+16);lg.append(svgEl('rect',{x:link.lx-w/2,y:link.ly-10.5,width:w,height:21,rx:4}));lg.append(svgEl('text',{x:link.lx,y:link.ly+4,'text-anchor':'middle'},link.label));labelLayer.append(lg);}}
let selectedId=null;
let suppressClickUntil=0;
for(const m of modules){const g=svgEl('g',{class:'node '+m.kind,'data-node':m.id,tabindex:0,role:'button','aria-label':m.name.join(' ')});g.append(svgEl('rect',{x:m.x,y:m.y,width:m.w,height:m.h,rx:6}));const lineHeight=m.name.length*18+m.sub.length*16;let ty=m.y+(m.h-lineHeight)/2+13;for(const s of m.name){g.append(svgEl('text',{x:m.x+m.w/2,y:ty,'text-anchor':'middle',class:'node-name'},s));ty+=18;}for(const s of m.sub){g.append(svgEl('text',{x:m.x+m.w/2,y:ty+1,'text-anchor':'middle',class:'node-sub'},s));ty+=16;}g.append(svgEl('title',{},m.name.join(' ')+' · '+m.ev));g.addEventListener('click',()=>{if(performance.now()>=suppressClickUntil)select(m.id);});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(m.id);}});nodeLayer.append(g);}
for(const el of document.querySelectorAll('.node-name')){const m=index.get(el.parentNode.dataset.node);if(el.textContent.length*7.5>m.w-22)el.setAttribute('style','font-size:13px');}
function select(id){if(selectedId===id){clearSelection();return;}if(!index.has(id))return;selectedId=id;const near=new Set([id]),connected=new Set();for(const e of links)if(e.from===id||e.to===id){near.add(e.from);near.add(e.to);connected.add(e.id);}for(const el of nodeLayer.children){el.classList.toggle('dim',!near.has(el.dataset.node));el.classList.toggle('selected',el.dataset.node===id);el.setAttribute('aria-pressed',el.dataset.node===id?'true':'false');}for(const el of edgeLayer.children){el.classList.toggle('dim',!connected.has(el.dataset.edge));el.querySelector('path').classList.toggle('active',connected.has(el.dataset.edge));}for(const el of labelLayer.children)el.classList.toggle('dim',!connected.has(el.dataset.edge));}
function clearSelection(){selectedId=null;for(const el of document.querySelectorAll('.dim,.selected,.active'))el.classList.remove('dim','selected','active');for(const el of nodeLayer.children)el.setAttribute('aria-pressed','false');}
canvas.addEventListener('contextmenu',e=>{e.preventDefault();clearSelection();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')clearSelection();});
document.getElementById('clear').addEventListener('click',clearSelection);
// Zoom changes only the SVG camera. The document never grows or acquires scrollbars.
const fullView={x:0,y:0,w:1900,h:1650};
let view={...fullView},zoom=1;
function renderView(){view.x=Math.max(0,Math.min(fullView.w-view.w,view.x));view.y=Math.max(0,Math.min(fullView.h-view.h,view.y));canvas.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);canvas.classList.toggle('zoomed',zoom>1);document.getElementById('zoom-level').textContent=Math.round(zoom*100)+'%';document.getElementById('zoom-out').disabled=zoom<=1;document.getElementById('zoom-in').disabled=zoom>=4;}
function setZoom(value,anchor){const next=Math.max(1,Math.min(4,value));const p=anchor||{x:view.x+view.w/2,y:view.y+view.h/2};const rx=(p.x-view.x)/view.w,ry=(p.y-view.y)/view.h;view.w=fullView.w/next;view.h=fullView.h/next;view.x=p.x-rx*view.w;view.y=p.y-ry*view.h;zoom=next;renderView();}
function fit(){view={...fullView};zoom=1;renderView();}
function svgPoint(e){const p=canvas.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(canvas.getScreenCTM().inverse());}
document.getElementById('fit').addEventListener('click',fit);
document.getElementById('zoom-in').addEventListener('click',()=>setZoom(zoom*1.25));
document.getElementById('zoom-out').addEventListener('click',()=>setZoom(zoom/1.25));
canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*(e.deltaY<0?1.15:1/1.15),svgPoint(e));},{passive:false});
let drag=null;
canvas.addEventListener('pointerdown',e=>{if(e.button!==0||zoom<=1)return;drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,x:view.x,y:view.y,unit:1/Math.abs(canvas.getScreenCTM().a),moved:false};});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;if(drag.moved){if(!canvas.hasPointerCapture(e.pointerId))canvas.setPointerCapture(e.pointerId);view.x=drag.x-dx*drag.unit;view.y=drag.y-dy*drag.unit;canvas.classList.add('panning');renderView();}});
function endDrag(e){if(!drag||drag.id!==e.pointerId)return;if(drag.moved)suppressClickUntil=performance.now()+120;drag=null;canvas.classList.remove('panning');if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);}
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
