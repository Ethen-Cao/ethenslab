<div class="app">
<header><div><h1 id="page-title">电子电器架构图</h1><div class="subtitle" id="page-subtitle">车载网络拓扑</div></div><nav class="tabs" aria-label="查看内容" role="tablist"><button id="diagram-tab" role="tab" aria-controls="diagram-panel" aria-selected="true">电子电器架构图</button><button id="hardware-tab" role="tab" aria-controls="hardware-panel" aria-selected="false">IVI硬件架构图</button><button id="software-tab" role="tab" aria-controls="software-panel" aria-selected="false">软件架构图</button><button id="glossary-tab" role="tab" aria-controls="glossary-panel" aria-selected="false">缩写表</button></nav></header>

</main>
